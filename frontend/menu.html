<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse our delicious canteen menu — starters, main course, snacks, beverages, and desserts." />
  <title>Menu — QuickBite Canteen</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ── Menu QR Banner ── */
    .menu-qr-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1rem 1.5rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .menu-qr-canvas-wrap {
      background: #fff;
      border-radius: var(--radius-sm);
      padding: 8px;
      flex-shrink: 0;
    }
    .menu-qr-info h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .menu-qr-info p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .menu-qr-info .qr-url {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
      margin-top: 0.35rem;
      word-break: break-all;
    }
    @media (max-width: 480px) {
      .menu-qr-banner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root">
    <nav class="navbar" id="navbar"></nav>

    <div class="page-container">
      <!-- Menu QR Banner -->
      <div class="menu-qr-banner" id="menu-qr-banner">
        <div class="menu-qr-canvas-wrap">
          <div id="menu-qr-div"></div>
        </div>
        <div class="menu-qr-info">
          <h3>Scan to Order</h3>
          <p>Point your phone camera at this QR code to open the menu and place an order from your seat.</p>
          <div class="qr-url" id="menu-qr-url-text"></div>
        </div>
      </div>

      <div class="page-header">
        <h1>Our Menu</h1>
        <p>Fresh, delicious food prepared with love</p>
      </div>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="form-input" placeholder="Search for food..." id="menu-search" />
      </div>

      <!-- Category Filter -->
      <div class="category-filter" id="category-filter"></div>

      <!-- Food Grid / Loading / Empty -->
      <div id="food-content">
        <div class="loading-center">
          <div class="spinner"></div>
          <p>Loading menu...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
