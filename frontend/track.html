<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track your QuickBite Canteen order by entering your Order ID." />
  <title>Track Order — QuickBite Canteen</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="root">
    <nav class="navbar" id="navbar"></nav>
    <div class="page-container">
      <div id="track-content">
        <div class="page-header" style="text-align:center">
          <h1>Track Your Order</h1>
          <p>Enter your Order ID to check the status of your order</p>
        </div>

        <div style="max-width:480px;margin:0 auto">
          <div id="track-recent" style="display:none;margin-bottom:2rem">
            <div class="glass-card" style="padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
              <div>
                <p style="font-size:0.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.2rem">Your latest order</p>
                <p style="font-weight:700;font-size:1rem" id="recent-order-id-display"></p>
              </div>
              <a id="recent-order-link" href="#" class="btn btn-primary">View Status</a>
            </div>
          </div>

          <div class="glass-card" style="padding:1.75rem">
            <div class="form-group">
              <label>Order ID</label>
              <input type="number" class="form-input" id="order-id-input"
                     placeholder="e.g. 12" min="1" />
            </div>
            <div id="track-error"></div>
            <button class="btn btn-primary" style="width:100%" onclick="trackOrder()">
              Track Order
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
